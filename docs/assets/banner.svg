      <stop offset="0.6" stop-color="#2bd6a0" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#2bd6a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ef0c6" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="30" fill="url(#bg)"/>
